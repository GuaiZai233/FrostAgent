services:
  frostagent:
    build: .
    image: frostagent:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Management listens on container loopback; do not publish it in bridge mode.
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - frostagent-data:/app/data

volumes:
  frostagent-data:
