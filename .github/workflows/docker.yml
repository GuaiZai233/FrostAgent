name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    name: Docker Build and Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test documented bootstrap commands
        run: python3 -m unittest discover -s scripts -p 'test_docker_docs.py' -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frostagent:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build opt-in host-network image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frostagent:host
          build-args: DOCKER_WS_LISTEN_ADDR=127.0.0.1:1234
          cache-from: type=gha
      - name: Test Compose deployment
        run: python3 scripts/docker-smoke.py --host-network
