name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    name: Docker Build and Smoke
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test build metadata
        run: python3 -m unittest discover -s scripts -p 'test_build_metadata.py' -v
      - name: Resolve build metadata
        id: build
        run: python3 scripts/build_metadata.py >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: frostagent:local
          build-args: |
            FROSTAGENT_VERSION=${{ steps.build.outputs.version }}
            FROSTAGENT_COMMIT=${{ steps.build.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build opt-in host-network image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: frostagent:host
          build-args: |
            DOCKER_WS_LISTEN_ADDR=127.0.0.1:1234
            FROSTAGENT_VERSION=${{ steps.build.outputs.version }}
            FROSTAGENT_COMMIT=${{ steps.build.outputs.commit }}
          cache-from: type=gha
      - name: Test Compose deployment
        env:
          FROSTAGENT_EXPECTED_VERSION: ${{ steps.build.outputs.display_version }}
        run: python3 scripts/docker-smoke.py --host-network

  publish:
    name: Publish to GHCR
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.docker.outputs.commit }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/guaizai233/frostagent
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FROSTAGENT_VERSION=${{ needs.docker.outputs.version }}
            FROSTAGENT_COMMIT=${{ needs.docker.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
