name: Schema 15 Compatibility

on:
  pull_request:
    branches: [frostfallx/computer-use-design]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: frostagent
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: frostagent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frostagent -d frostagent_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
      - name: Generate protocol
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          make proto-generate-go
      - name: Storage and runtime regressions
        run: go test -race ./internal/storage ./internal/modelrouter ./internal/backup ./internal/instance ./internal/computeruse/... -count=1 -timeout 300s
      - name: PostgreSQL compatibility
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/storage ./internal/modelrouter ./internal/backup -run 'Postgres|TestProviderSchemaMigration|TestSharedCatalog' -count=1 -timeout 300s
      - name: Vet changed packages
        run: go vet ./internal/storage ./internal/modelrouter ./internal/backup ./internal/instance ./internal/tokenusage
