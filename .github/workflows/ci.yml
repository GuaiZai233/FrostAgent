name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to read-only access for security
permissions:
  contents: read

jobs:
  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: frostagent
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: frostagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frostagent -d frostagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'go.sum'
      - name: Test PostgreSQL migrations
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/storage -run '^(TestPostgresMigration|TestProviderSchemaMigration|TestProviderMigrationFailureIsAtomic)' -count=1 -v
      - name: Test shared providers on PostgreSQL
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/modelrouter -run '^(TestSharedCatalogAndIsolatedRoutes|TestCatalogDraftOwnerKeepsEndpointAndSecretTogether|TestRoutePublicationGuardKeepsScopesIsolated)$' -count=1 -v
      - name: Generate Go proto for restore test
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          make proto-generate-go
      - name: Test PostgreSQL restore rollback
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/instance -run '^TestPostgresRestoreFailureRollsBackSharedCatalog$' -count=1 -v
      - name: Test Skills on PostgreSQL
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/instance -run '^TestSkillsZIPRestore$' -count=1 -v
      - name: Test PostgreSQL settings draft transaction and rollback
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/instance -run '^TestPostgresSettingsDraftCommitAndRollback$' -count=1 -v
      - name: Test PostgreSQL memory writes
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/memory -run '^TestPostgresMemoryHotpaths$' -count=1 -v

      - name: Test PostgreSQL vector storage
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: |
          psql "$FROSTAGENT_TEST_POSTGRES_DSN" -c "CREATE EXTENSION IF NOT EXISTS vector"
          go test ./internal/memory -run '^TestPostgresEmbedding' -count=1 -v

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check dependency pins
        run: python3 -m unittest discover -s scripts -p 'test_dependency_pins.py' -v

      # pnpm must be set up before setup-node can use its cache
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'go.sum'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # buf compiles protobuf schemas into Go and TypeScript code as part of Makefile targets
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.75.0

      - name: Run AstrBot plugin unit tests
        run: python3 -m unittest discover -s adapters/astrbot_plugin_frostagent -p 'test_*.py' -v

      - name: Run frontend instance isolation regression
        run: pnpm --filter @frostagent/web test

      - name: Run checks
        run: make ci

      - name: Run concurrency and race regressions
        run: go test -race ./internal/instance/... ./internal/service/security/... ./internal/llm/... ./internal/memory/... ./internal/groupsummary/... ./internal/modelrouter/... ./internal/adapter/onebot/... ./internal/adapter/astrbot/... -timeout 300s

      - name: Run WebSocket heartbeat race regression
        run: go test -race ./internal/adapter/heartbeat/... -timeout 60s

      - name: Upload Go coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'go.sum'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @frostagent/web run build

      - name: Install proto tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate Go proto
        run: buf generate --template buf.gen.yaml

      - name: Build cmd/app
        run: go build ./cmd/app

      - name: Run tests
        run: go test ./...
