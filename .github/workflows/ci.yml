name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to read-only access for security
permissions:
  contents: read

jobs:
  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frostagent
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: frostagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frostagent -d frostagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Test PostgreSQL migrations
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/storage -run '^TestPostgresMigration' -count=1 -v
      - name: Test PostgreSQL memory writes
        env:
          FROSTAGENT_TEST_POSTGRES_DSN: postgres://frostagent:synthetic-test-password@localhost:5432/frostagent_test?sslmode=disable
        run: go test ./internal/memory -run '^TestPostgresMemoryHotpaths$' -count=1 -v

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up before setup-node can use its cache
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # buf compiles protobuf schemas into Go and TypeScript code as part of Makefile targets
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@latest

      - name: Run AstrBot plugin unit tests
        run: python3 -m unittest discover -s adapters/astrbot_plugin_frostagent -p 'test_*.py' -v

      - name: Run frontend instance isolation regression
        run: pnpm --filter @frostagent/web test

      - name: Run checks
        run: make ci

      - name: Run concurrency and race regressions
        run: go test -race ./internal/instance/... ./internal/service/security/... ./internal/llm/... ./internal/adapter/onebot/... ./internal/adapter/astrbot/... -timeout 300s

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @frostagent/web run build

      - name: Install proto tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Generate Go proto
        run: buf generate --template buf.gen.yaml

      - name: Build cmd/app
        run: go build ./cmd/app

      - name: Run tests
        run: go test ./...
