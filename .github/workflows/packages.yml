name: Backend Packages

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: '1.75.0'
          setup_only: true
      - run: pnpm install --frozen-lockfile
      - run: make package
      - name: Exercise Linux IPC as root and ordinary user
        run: |
          go test -c -o /tmp/frostagent-managementipc.test ./internal/managementipc
          /tmp/frostagent-managementipc.test -test.v
          sudo /tmp/frostagent-managementipc.test -test.v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frostagent-backend-bundles
          path: bin/packages/*.zip
          if-no-files-found: error
