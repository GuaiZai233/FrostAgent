version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker-compose
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    allow:
      - dependency-name: alpine/socat
