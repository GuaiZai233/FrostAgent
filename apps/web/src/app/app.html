<div hlmSidebarWrapper>
  <hlm-sidebar collapsible="icon">
    <div hlmSidebarHeader>
      <a
        hlmSidebarMenuButton
        size="lg"
        routerLink="/overview"
        tooltip="FrostAgent"
        aria-label="FrostAgent"
      >
        <span class="bg-primary text-primary-foreground flex size-8 shrink-0 items-center justify-center rounded-lg">
          <app-icon>ac_unit</app-icon>
        </span>
        <span class="font-semibold">FrostAgent</span>
      </a>
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <ul hlmSidebarMenu aria-label="FrostAgent">
          @for (destination of destinations; track destination.path) {
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                [routerLink]="destination.path"
                [isActive]="isSelected(destination.path)"
                [tooltip]="destination.label"
                [attr.aria-current]="isSelected(destination.path) ? 'page' : null"
              >
                <app-icon>{{ destination.icon }}</app-icon>
                <span>{{ destination.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

    @if (shouldShowFab()) {
      <div hlmSidebarFooter>
        <button
          hlmSidebarMenuButton
          tooltip="新增环境变量"
          i18n-tooltip="@@addEnvVar"
          (click)="openAddEnvVarDialog()"
        >
          <app-icon>add</app-icon>
          <span i18n="@@EnvVar">环境变量</span>
        </button>
      </div>
    }
    <button hlmSidebarRail aria-label="Toggle Sidebar"></button>
  </hlm-sidebar>

  <main hlmSidebarInset>
    <header class="bg-background/95 sticky top-0 z-10 flex h-12 items-center gap-2 border-b px-3 backdrop-blur md:hidden">
      <button hlmSidebarTrigger srOnlyText="Toggle navigation"></button>
      <span class="font-medium">FrostAgent</span>
    </header>
    <section class="min-w-0 flex-1">
      <router-outlet />
    </section>
  </main>
</div>

<hlm-toaster
  [theme]="themeService.effectiveMode()"
  position="bottom-right"
  richColors
  closeButton
/>
