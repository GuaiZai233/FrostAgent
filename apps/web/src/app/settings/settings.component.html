<section class="mx-auto max-w-6xl p-4 sm:p-6">
  @if (!isChildRoute()) {
    <header class="mb-6">
      <h1 class="text-2xl font-semibold tracking-tight" i18n="@@settingsTitle">
        设置
      </h1>
    </header>

    <div class="grid gap-4 sm:grid-cols-2">
      <a
        hlmCard
        routerLink="/settings/backend"
        class="hover:bg-muted/40 focus-visible:ring-ring cursor-pointer transition-colors focus-visible:ring-2 focus-visible:outline-none"
      >
        <div hlmCardContent class="flex items-center gap-4">
          <span class="bg-primary/10 text-primary flex size-11 items-center justify-center rounded-xl">
            <app-icon>dns</app-icon>
          </span>
          <div>
            <h2 hlmCardTitle i18n="@@backendSettings">bot设置</h2>
            <p hlmCardDescription i18n="@@backendSettingsDesc">
              快捷修改服务端环境变量
            </p>
          </div>
        </div>
      </a>

      <a
        hlmCard
        routerLink="/settings/frontend"
        class="hover:bg-muted/40 focus-visible:ring-ring cursor-pointer transition-colors focus-visible:ring-2 focus-visible:outline-none"
      >
        <div hlmCardContent class="flex items-center gap-4">
          <span class="bg-accent text-accent-foreground flex size-11 items-center justify-center rounded-xl">
            <app-icon>palette</app-icon>
          </span>
          <div>
            <h2 hlmCardTitle i18n="@@frontendSettings">网页设置</h2>
            <p hlmCardDescription i18n="@@frontendSettingsDesc">
              语言、色彩等
            </p>
          </div>
        </div>
      </a>
    </div>
  }

  <router-outlet />
</section>
