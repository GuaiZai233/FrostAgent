<div class="grid gap-6">
  <header class="flex items-center gap-3">
    <a
      hlmBtn
      variant="ghost"
      size="icon"
      routerLink="/settings"
      aria-label="Back to settings"
    >
      <app-icon>arrow_back</app-icon>
    </a>
    <h1 class="text-2xl font-semibold">
      网页设置
    </h1>
  </header>

  <section hlmCard>
    <div hlmCardHeader>
      <h2 hlmCardTitle>主题</h2>
    </div>
    <div hlmCardContent>
      <div
        hlmToggleGroup
        type="single"
        variant="outline"
        [value]="themeService.currentMode()"
        (valueChange)="setTheme($event)"
        aria-label="Theme"
      >
        @for (option of themeOptions; track option.mode) {
          <button hlmToggleGroupItem [value]="option.mode">
            <app-icon>{{ option.icon }}</app-icon>
            <span>{{ option.label }}</span>
          </button>
        }
      </div>
    </div>
  </section>
</div>
