<section class="page">
  <mat-toolbar style="margin-bottom: 16px; border-radius: 12px">
    <a mat-icon-button routerLink="/settings" aria-label="Back to settings">
      <app-icon>arrow_back</app-icon>
    </a>
    <span i18n="@@backendSettingsTitle">后端设置</span>
    <span style="flex: 1"></span>
    <button mat-icon-button (click)="refresh()">
      <app-icon>refresh</app-icon>
    </button>
  </mat-toolbar>

  @if (loading() || saving()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (error()) {
    <mat-card>
      <mat-card-content>{{ error() }}</mat-card-content>
    </mat-card>
  }

  <mat-tab-group animationDuration="200ms">
    <mat-tab i18n-label="@@envVarsTab" label="环境变量">
      <section style="margin-top: 16px">
        <mat-card>
          <table mat-table [dataSource]="envVars()">
            <ng-container matColumnDef="key">
              <th mat-header-cell *matHeaderCellDef i18n="@@key">Key</th>
              <td mat-cell *matCellDef="let env">
                <div style="display: flex; align-items: center; gap: 4px">
                  @if (env.isSecret) {
                    <app-icon
                      style="
                        font-size: 18px;
                        width: 18px;
                        height: 18px;
                        margin-right: 4px;
                      "
                      i18n-title="@@isSecret"
                      title="这是敏感信息"
                      >lock</app-icon
                    >
                  }
                  {{ env.key }}
                </div>
              </td>
            </ng-container>

            <ng-container matColumnDef="value">
              <th mat-header-cell *matHeaderCellDef i18n="@@value">Value</th>
              <td mat-cell *matCellDef="let env">
                @if (editingKey() === env.key) {
                  <div
                    style="
                      display: flex;
                      flex-direction: column;
                      padding: 12px 0;
                    "
                  >
                    <mat-form-field
                      appearance="outline"
                      subscriptSizing="dynamic"
                    >
                      <mat-label i18n="@@value">Value</mat-label>
                      <input
                        matInput
                        [ngModel]="editingValue()"
                        (ngModelChange)="editingValue.set($event)"
                      />
                    </mat-form-field>
                    <mat-checkbox
                      style="margin-top: 4px"
                      [ngModel]="editingIsSecret()"
                      (ngModelChange)="editingIsSecret.set($event)"
                    >
                      <span i18n="@@isSecret">这是敏感信息</span>
                    </mat-checkbox>
                  </div>
                } @else {
                  <code>{{ displayValue(env) || '-' }}</code>
                }
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef i18n="@@actions">操作</th>
              <td mat-cell *matCellDef="let env">
                @if (editingKey() === env.key) {
                  <button
                    mat-icon-button
                    type="button"
                    (click)="saveEdit()"
                    aria-label="Save"
                  >
                    <app-icon>check</app-icon>
                  </button>
                  <button
                    mat-icon-button
                    type="button"
                    (click)="cancelEdit()"
                    aria-label="Cancel"
                  >
                    <app-icon>close</app-icon>
                  </button>
                } @else {
                  @if (env.isSecret) {
                    <button
                      mat-icon-button
                      type="button"
                      (click)="toggleSecret(env.key)"
                      aria-label="Toggle secret visibility"
                    >
                      <app-icon>{{
                        isSecretVisible(env.key)
                          ? 'visibility_off'
                          : 'visibility'
                      }}</app-icon>
                    </button>
                  }
                  <button
                    mat-icon-button
                    type="button"
                    (click)="startEdit(env)"
                    aria-label="Edit"
                  >
                    <app-icon>edit</app-icon>
                  </button>
                  <button
                    mat-icon-button
                    type="button"
                    (click)="deleteEnvVar(env.key)"
                    aria-label="Delete"
                  >
                    <app-icon>delete</app-icon>
                  </button>
                }
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </mat-card>
      </section>
    </mat-tab>

    <mat-tab i18n-label="@@rawEnvTab" label="原始 .env">
      <section>
        <mat-card appearance="outlined">
          <mat-card-content>
            <div style="height: 500px; overflow: hidden">
              <div #editor style="height: 100%"></div>
            </div>
          </mat-card-content>
          <mat-card-actions align="end">
            <button mat-flat-button type="button" (click)="saveRawEnvFile()">
              <app-icon>save</app-icon>
              <span i18n="@@saveRawEnv">保存 .env</span>
            </button>
          </mat-card-actions>
        </mat-card>
      </section>
    </mat-tab>
  </mat-tab-group>
</section>
