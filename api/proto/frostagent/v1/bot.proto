syntax = "proto3";

package frostagent.v1;

import "frostagent/v1/common.proto";

// BotStatusService provides bot overview and session management.
service BotStatusService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  rpc GetSessionContext(GetSessionContextRequest) returns (GetSessionContextResponse);
  rpc DeleteGroupSummary(DeleteGroupSummaryRequest) returns (DeleteGroupSummaryResponse);
}

enum BotStatus {
  BOT_STATUS_UNSPECIFIED = 0;
  BOT_STATUS_INITIALIZING = 1;
  BOT_STATUS_RUNNING = 2;
  BOT_STATUS_ERROR = 3;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  string bot_name = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  int64 total_messages_processed = 4;
  int32 active_sessions = 5;
  string current_model = 6;
  BotStatus status = 7;
  repeated ToolInfo tools = 8;
}

message GetSessionsRequest {
  Pagination pagination = 1;
}

message GetSessionsResponse {
  repeated SessionInfo sessions = 1;
  Pagination pagination = 2;
}

message DeleteGroupSummaryRequest {
  string session_id = 1;
}

message DeleteGroupSummaryResponse {
  bool success = 1;
  string error = 2;
}

message GetSessionContextRequest {
  string session_id = 1;
  int32 recent_limit = 2;
}

message SummaryGroupInfoProto {
  string summary = 1;
  repeated string message_ids = 2;
  string start_message_id = 3;
  string end_message_id = 4;
  int32 start_index = 5;
  int32 end_index = 6;
  repeated string messages = 7;
}

message SessionHistoryMessageProto {
  string role = 1;
  string content = 2;
}

message GetSessionContextResponse {
  string session_id = 1;
  string platform = 2;
  string running_summary = 3;
  repeated string recent_messages = 4;
  repeated SummaryGroupInfoProto summary_groups = 5;
  repeated SessionHistoryMessageProto history = 6;
  string prompt_text = 7;
  // Last real system prompt sent to the LLM (dynamically assembled: time + dialogue + memory).
  // Empty when no LLM request has occurred for this session yet.
  string system_prompt = 8;
  string model = 9;
}
