syntax = "proto3";

package frostagent.v1;

import "frostagent/v1/common.proto";

// BotStatusService provides bot overview and session management.
service BotStatusService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc SetToolEnabled(SetToolEnabledRequest) returns (SetToolEnabledResponse);
  rpc GetBalanceQueryConfig(GetBalanceQueryConfigRequest) returns (BalanceQueryConfigResponse);
  rpc SaveBalanceQueryConfig(SaveBalanceQueryConfigRequest) returns (BalanceQueryConfigResponse);
  rpc TestBalanceQueryConfig(TestBalanceQueryConfigRequest) returns (TestBalanceQueryConfigResponse);
  rpc FetchQuotaConfig(FetchQuotaConfigRequest) returns (FetchQuotaConfigResponse);
  rpc ClearBalanceQueryConfig(ClearBalanceQueryConfigRequest) returns (BalanceQueryConfigResponse);
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  rpc GetSessionContext(GetSessionContextRequest) returns (GetSessionContextResponse);
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);
  rpc ListSessionTools(ListSessionToolsRequest) returns (ListSessionToolsResponse);
  rpc GetToolHistoryEntry(GetToolHistoryEntryRequest) returns (GetToolHistoryEntryResponse);
  rpc GetSessionToolActivity(GetSessionToolActivityRequest) returns (GetSessionToolActivityResponse);
  rpc DeleteGroupSummary(DeleteGroupSummaryRequest) returns (DeleteGroupSummaryResponse);
}

enum BotStatus {
  BOT_STATUS_UNSPECIFIED = 0;
  BOT_STATUS_INITIALIZING = 1;
  BOT_STATUS_RUNNING = 2;
  BOT_STATUS_ERROR = 3;
  BOT_STATUS_STOPPED = 4;
}

message GetOverviewRequest {}

message SetToolEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message SetToolEnabledResponse {}

message GetBalanceQueryConfigRequest {}

message SaveBalanceQueryConfigRequest {
  string curl = 1;
  // Write-only. Empty preserves the existing manually configured key.
  string api_key = 2;
  // Explicitly clears the stored manual key. Cannot be combined with api_key
  // or provider_id.
  bool clear_api_key = 3;
  // Published provider whose current credential is resolved by the backend.
  string provider_id = 4;
  // Quota-to-dollar ratio for New API results; 0 disables conversion.
  double quota_per_unit = 5;
  // The template targets a New API endpoint; the response must then be a valid New API payload.
  bool newapi = 6;
  // Exchange rate and display unit from the remote New API status; saved with the template.
  double usd_exchange_rate = 7;
  string quota_display_type = 8;
  string custom_currency_symbol = 9;
  double custom_currency_exchange_rate = 10;
}

// Deletes the whole stored balance_query configuration, returning the tool to unconfigured.
message ClearBalanceQueryConfigRequest {}

// Runs the draft request once without saving anything. The response body is never returned.
message TestBalanceQueryConfigRequest {
  string curl = 1;
  // Write-only. Empty reuses the stored manual key only when the endpoint is unchanged.
  string api_key = 2;
  string provider_id = 3;
  double quota_per_unit = 4;
  bool newapi = 5;
  double usd_exchange_rate = 6;
  string quota_display_type = 7;
  string custom_currency_symbol = 8;
  double custom_currency_exchange_rate = 9;
}

message TestBalanceQueryConfigResponse {
  bool ok = 1;
  string message = 2;
}

message BalanceQueryConfigResponse {
  string curl = 1;
  bool api_key_configured = 2;
  string provider_id = 3;
  repeated BalanceQueryProvider providers = 4;
  double quota_per_unit = 5;
  bool newapi = 6;
  double usd_exchange_rate = 7;
  string quota_display_type = 8;
  string custom_currency_symbol = 9;
  double custom_currency_exchange_rate = 10;
}

message BalanceQueryProvider {
  string id = 1;
  string display_name = 2;
  bool available = 3;
  // Base URL of the provider endpoint, used by presets that reuse it (for example New API).
  string base_url = 4;
}

message GetOverviewResponse {
  string bot_name = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  int64 total_messages_processed = 4;
  int32 active_sessions = 5;
  string current_model = 6;
  BotStatus status = 7;
  repeated ToolInfo tools = 8;
  string ws_listen_addr = 9;
  TokenUsageOverview token_usage = 10;
}

message GetSessionsRequest {
  Pagination pagination = 1;
  string platform = 2;
}

message GetSessionsResponse {
  repeated SessionInfo sessions = 1;
  Pagination pagination = 2;
}

message DeleteGroupSummaryRequest {
  string session_id = 1;
}

message DeleteGroupSummaryResponse {
  bool success = 1;
  string error = 2;
}

message GetSessionContextRequest {
  string session_id = 1;
  int32 recent_limit = 2;
  optional bool include_prompt = 3;
}

// Browses committed chat originals; independent of compact/context retention.
message GetSessionHistoryRequest {
  string session_id = 1;
  // RFC3339 instants: inclusive start, exclusive end. Empty means unbounded.
  string after = 2;
  string before = 3;
  string page_token = 4;
  int32 page_size = 5;
}

message SessionChatRecord {
  string id = 1;
  string message_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string role = 5;
  string content = 6;
  string occurred_at = 7;
  string reply_to = 8;
  string delivery_status = 9;
}

message GetSessionHistoryResponse {
  repeated SessionChatRecord records = 1;
  string next_page_token = 2;
  ArchiveCoverage coverage = 3;
}

// Lists archived tool calls for messages shown in one session timeline. Only
// call metadata is returned; arguments and results load through
// GetToolHistoryEntry when a card is expanded.
message GetSessionToolActivityRequest {
  string session_id = 1;
  // Source message IDs of the timeline items currently displayed (at most 200).
  repeated string source_message_ids = 2;
}

message SessionToolActivityEntry {
  string ref_id = 1;
  string tool = 2;
}

message SessionToolActivity {
  string source_message_id = 1;
  // Newest calls of the source message, oldest first (at most 10).
  repeated SessionToolActivityEntry entries = 2;
  // Exact number of archived calls of the source message.
  int32 total = 3;
}

message GetSessionToolActivityResponse {
  repeated SessionToolActivity activities = 1;
}

message GetToolHistoryEntryRequest {
  string ref_id = 1;
  string session_id = 4;
  // Only result inspection requests the original result; arguments-only
  // expansion never transfers it.
  bool include_result = 2;
  // Character offset into the original result, paged like read_tool_history.
  int32 result_offset = 3;
}

// Read-only inspector details for an archived call in the selected instance.
message GetToolHistoryEntryResponse {
  string ref_id = 1;
  string tool = 2;
  string arguments_raw = 3;
  bool arguments_available = 4;
  // Execution or result review is incomplete; the inspector may retry later.
  bool arguments_pending = 5;
  // One bounded page of the original execution result, visible under the same
  // review rules as arguments. Present only when include_result was requested,
  // and in that mode arguments_raw is omitted.
  string result_raw = 6;
  bool result_available = 7;
  int32 result_offset = 8;
  int32 result_total_chars = 9;
  bool result_has_more = 10;
  int32 result_next_offset = 11;
}

message SummaryGroupInfoProto {
  string summary = 1;
  repeated string message_ids = 2;
  string start_message_id = 3;
  string end_message_id = 4;
  int32 start_index = 5;
  int32 end_index = 6;
  repeated string messages = 7;
  repeated GroupMessageInfoProto structured_messages = 8;
}

message GroupMessageInfoProto {
  string role = 1;
  string sender = 2;
  string sender_id = 3;
  string content = 4;
  string message_id = 5;
  string time = 6;
  // Internal tool timeline annotation, distinct from a delivered assistant reply.
  string tool_history_run_id = 7;
  // Per image placeholder in content, a log-image key for hover previews (empty when unavailable).
  repeated string image_hashes = 8;
}

message SessionHistoryMessageProto {
  string role = 1;
  string content = 2;
  string tool_history_run_id = 3;
}

message GetSessionContextResponse {
  string session_id = 1;
  string platform = 2;
  string running_summary = 3;
  repeated string recent_messages = 4;
  repeated SummaryGroupInfoProto summary_groups = 5;
  repeated SessionHistoryMessageProto history = 6;
  string prompt_text = 7;
  // Last real system prompt sent to the LLM (dynamically assembled: time + dialogue + memory).
  // Empty when no LLM request has occurred for this session yet.
  string system_prompt = 8;
  string model = 9;
  repeated GroupMessageInfoProto recent_structured_messages = 10;
  // True when the group is outside the group compact whitelist: no summary or raw group context is provided.
  bool group_compact_disabled = 11;
  // Latest provider-neutral request with inline media; diagnostic only, never replayed.
  string actual_request_json = 12;
  string request_at = 13;
}

// Known provider values are retained alongside calls whose value was omitted.
message TokenUsageCounter {
  int64 value = 1;
  int64 unestimated_requests = 2;
}

message TokenUsageModule {
  string module = 1;
  int64 requests = 2;
  TokenUsageCounter input = 3;
  TokenUsageCounter output = 4;
  TokenUsageCounter total = 5;
  TokenUsageCounter cached = 6;
  TokenUsageCounter cache_hits = 7;
}

message TokenUsageOverview {
  repeated TokenUsageModule modules = 1;
  bool incomplete = 2;
  bool available = 3;
}

message FetchQuotaConfigRequest {
  // Template whose origin (scheme and host) is queried at /api/status.
  string curl = 1;
}

message FetchQuotaConfigResponse {
  bool ok = 1;
  string message = 2;
  double quota_per_unit = 3;
  double usd_exchange_rate = 4;
  string quota_display_type = 5;
  string custom_currency_symbol = 6;
  double custom_currency_exchange_rate = 7;
}

message ArchiveCoverage {
 string since = 1;
 string until = 2;
 int64 count = 3;
 string status = 4;
}
message ListSessionToolsRequest { string session_id = 1; int32 limit = 2; }
message SessionToolRecord {
 string ref_id = 1;
 string run_id = 2;
 string tool = 3;
 string state = 4;
 string result_summary = 5;
 string occurred_at = 6;
 bool restricted = 7;
}
message ListSessionToolsResponse {
 repeated SessionToolRecord calls = 1;
 ArchiveCoverage coverage = 2;
}
