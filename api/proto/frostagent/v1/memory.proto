syntax = "proto3";

package frostagent.v1;

import "frostagent/v1/common.proto";

// MemoryService provides memory management for the web UI.
service MemoryService {
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc AddMemory(AddMemoryRequest) returns (AddMemoryResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc GetMemoryStats(GetMemoryStatsRequest) returns (GetMemoryStatsResponse);
  rpc ExportMemories(ExportMemoriesRequest) returns (ExportMemoriesResponse);
  rpc ImportMemories(ImportMemoriesRequest) returns (ImportMemoriesResponse);
  rpc TriggerReflection(TriggerReflectionRequest) returns (TriggerReflectionResponse);
}

// MemoryEntry mirrors the internal memory model for the UI.
message MemoryEntry {
  string id = 1;
  string owner = 2;
  string content = 3;
  repeated string tags = 4;
  string source = 5;
  string visibility = 6;
  double importance = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListMemoriesRequest {
  string owner = 1;           // filter by owner (empty = all)
  Pagination pagination = 2;
}

message ListMemoriesResponse {
  repeated MemoryEntry memories = 1;
  Pagination pagination = 2;
}

message SearchMemoriesRequest {
  string query = 1;
  Pagination pagination = 2;
}

message SearchMemoriesResponse {
  repeated MemoryEntry memories = 1;
  Pagination pagination = 2;
}

message AddMemoryRequest {
  string owner = 1;
  string content = 2;
  repeated string tags = 3;
  string visibility = 4;      // "public" or "private" (default private)
}

message AddMemoryResponse {
  MemoryEntry memory = 1;
  string error = 2;
}

message UpdateMemoryRequest {
  string id = 1;
  string content = 2;
  repeated string tags = 3;
  string visibility = 4;
  double importance = 5;
}

message UpdateMemoryResponse {
  bool success = 1;
  string error = 2;
}

message DeleteMemoryRequest {
  string id = 1;
}

message DeleteMemoryResponse {
  bool success = 1;
  string error = 2;
}

message GetMemoryStatsRequest {}

message GetMemoryStatsResponse {
  int32 total = 1;
  int32 public_count = 2;
  int32 private_count = 3;
  map<string, int32> by_owner = 4;
}

message ExportMemoriesRequest {}

message ExportMemoriesResponse {
  string json_content = 1;    // full export JSON string
  string error = 2;
}

message ImportMemoriesRequest {
  string json_content = 1;    // export JSON string to import
  bool overwrite = 2;         // overwrite existing IDs
}

message ImportMemoriesResponse {
  int32 imported = 1;
  int32 skipped = 2;
  string error = 3;
}

message TriggerReflectionRequest {
  string owner = 1;           // empty = reflect all owners
}

message TriggerReflectionResponse {
  bool started = 1;           // true when a new background job was accepted
  bool running = 2;
  string owner = 3;           // empty = all owners
  string started_at = 4;
  string last_completed_at = 5;
  string last_error = 6;
  string error = 7;
}
