syntax = "proto3";

package frostagent.v1;

import "frostagent/v1/common.proto";

// MemoryService provides memory management for the web UI.
service MemoryService {
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc AddMemory(AddMemoryRequest) returns (AddMemoryResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc GetMemoryStats(GetMemoryStatsRequest) returns (GetMemoryStatsResponse);
  rpc ExportMemories(ExportMemoriesRequest) returns (ExportMemoriesResponse);
  rpc ImportMemories(ImportMemoriesRequest) returns (ImportMemoriesResponse);
  rpc TriggerReflection(TriggerReflectionRequest) returns (TriggerReflectionResponse);

  // Group profile and member management
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc GetGroupProfile(GetGroupProfileRequest) returns (GetGroupProfileResponse);
  rpc UpdateGroupProfile(UpdateGroupProfileRequest) returns (UpdateGroupProfileResponse);
  rpc UpdateMemberProfile(UpdateMemberProfileRequest) returns (UpdateMemberProfileResponse);
}

// MemoryEntry mirrors the internal memory model for the UI.
message MemoryEntry {
  string id = 1;
  string owner = 2;
  string content = 3;
  repeated string tags = 4;
  string source = 5;
  string visibility = 6;      // deprecated
  string created_at = 7;
  string updated_at = 8;
  int32 access_count = 9;
  string scope = 10;          // "private" or "group"
  string group_id = 11;       // group id when scope == "group"
}

message ListMemoriesRequest {
  string scope = 1;           // "private" or "group" (empty = "private")
  string group_id = 2;        // required when scope == "group"
  string owner = 3;           // filter by owner (empty = all)
  Pagination pagination = 4;
}

message ListMemoriesResponse {
  repeated MemoryEntry memories = 1;
  Pagination pagination = 2;
}

message SearchMemoriesRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;        // required when scope == "group"
  string query = 3;
  Pagination pagination = 4;
}

message SearchMemoriesResponse {
  repeated MemoryEntry memories = 1;
  Pagination pagination = 2;
}

message AddMemoryRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;        // required when scope == "group"
  string owner = 3;
  string content = 4;
  repeated string tags = 5;
  string visibility = 6;      // deprecated
}

message AddMemoryResponse {
  MemoryEntry memory = 1;
  string error = 2;
}

message UpdateMemoryRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;        // required when scope == "group"
  string id = 3;
  string content = 4;
  repeated string tags = 5;
  string visibility = 6;      // deprecated
}

message UpdateMemoryResponse {
  bool success = 1;
  string error = 2;
}

message DeleteMemoryRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;        // required when scope == "group"
  string id = 3;
}

message DeleteMemoryResponse {
  bool success = 1;
  string error = 2;
}

message GetMemoryStatsRequest {
  string scope = 1;           // "private", "group", or empty
  string group_id = 2;        // group id when scope == "group"
}

message GetMemoryStatsResponse {
  int32 total = 1;
  int32 public_count = 2;     // deprecated, always 0
  int32 private_count = 3;    // deprecated, always 0
  map<string, int32> by_owner = 4;
  int32 private_chat_count = 5;
  int32 group_chat_count = 6;
  int32 group_count = 7;
}

message ExportMemoriesRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;
}

message ExportMemoriesResponse {
  string json_content = 1;    // full export JSON string
  string error = 2;
}

message ImportMemoriesRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;
  string json_content = 3;    // export JSON string to import
  bool overwrite = 4;         // overwrite existing IDs
}

message ImportMemoriesResponse {
  int32 imported = 1;
  int32 skipped = 2;
  string error = 3;
}

message TriggerReflectionRequest {
  string scope = 1;           // "private" or "group"
  string group_id = 2;
  string owner = 3;           // empty = reflect all owners
}

message TriggerReflectionResponse {
  bool started = 1;           // true when a new background job was accepted
  bool running = 2;
  string owner = 3;           // empty = all owners
  string started_at = 4;
  string last_completed_at = 5;
  string last_error = 6;
  string error = 7;
}

// Group and Member Profile models
message GroupSummary {
  string group_id = 1;
  string group_name = 2;
  int32 member_count = 3;
  int32 memory_count = 4;
  string updated_at = 5;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated GroupSummary groups = 1;
}

message MemberProfile {
  string user_id = 1;
  string nickname = 2;
  string card = 3;
  string role = 4;
  string preferred_name = 5;
  repeated string aliases = 6;
  string calling_name = 7;    // resolved calling name
  string source = 8;
  string created_at = 9;
  string updated_at = 10;
  string last_spoke_at = 11;
}

message GroupProfile {
  string group_id = 1;
  string group_name = 2;
  repeated MemberProfile members = 3;
  string updated_at = 4;
}

message GetGroupProfileRequest {
  string group_id = 1;
}

message GetGroupProfileResponse {
  GroupProfile profile = 1;
  string error = 2;
}

message UpdateGroupProfileRequest {
  string group_id = 1;
  string group_name = 2;
}

message UpdateGroupProfileResponse {
  bool success = 1;
  string error = 2;
}

message UpdateMemberProfileRequest {
  string group_id = 1;
  string user_id = 2;
  string preferred_name = 3;
  repeated string aliases = 4;
}

message UpdateMemberProfileResponse {
  bool success = 1;
  string error = 2;
}
